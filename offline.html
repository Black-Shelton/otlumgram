<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Нет подключения - OtlumGram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        body.light {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            color: #1a1a1a;
        }

        body.neon {
            background: linear-gradient(135deg, #0a1f0a 0%, #0a2a0a 100%);
            color: #0f0;
        }

        .offline-container {
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .offline-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: #888;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .retry-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .retry-btn:active {
            transform: scale(0.96);
        }

        .cached-info {
            font-size: 0.7rem;
            color: #666;
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: inline-block;
        }

        .cached-info a {
            color: #667eea;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.4rem;
            }
            .offline-icon {
                font-size: 4rem;
            }
            .retry-btn {
                padding: 12px 24px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>Нет подключения к интернету</h1>
        <p>Проверьте ваше интернет-соединение и попробуйте снова.<br>Некоторые функции могут быть недоступны в офлайн-режиме.</p>
        <button class="retry-btn" onclick="retryConnection()">🔄 Обновить страницу</button>
        <div class="cached-info">
            💡 <strong>Совет:</strong> Вы можете просматривать ранее загруженные данные<br>
            📱 <a href="/index.html">Попробовать открыть приложение</a>
        </div>
    </div>

    <script>
        function retryConnection() {
            if (navigator.onLine) {
                location.reload();
            } else {
                alert('Всё ещё нет интернета. Проверьте подключение и попробуйте снова.');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.classList.add(savedTheme);

        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
